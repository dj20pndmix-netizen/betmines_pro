<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Ball Sphere -->
  <circle cx="50" cy="50" r="46" fill="url(#ballGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Central Pentagon -->
  <polygon points="50,33 63,43 58,58 42,58 37,43" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Radiating Seams & Outer Patches -->
  <!-- Top Point to edge -->
  <line x1="50" y1="33" x2="50" y2="18" stroke="#1e293b" stroke-width="2"/>
  <polygon points="50,18 42,6 58,6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="42" y1="6" x2="50" y2="4" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="58" y1="6" x2="50" y2="4" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Top-Right Point to edge -->
  <line x1="63" y1="43" x2="77" y2="38" stroke="#1e293b" stroke-width="2"/>
  <polygon points="77,38 91,33 93,48 83,55" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Bottom-Right Point to edge -->
  <line x1="58" y1="58" x2="68" y2="72" stroke="#1e293b" stroke-width="2"/>
  <polygon points="68,72 73,87 59,94 51,84" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Bottom-Left Point to edge -->
  <line x1="42" y1="58" x2="32" y2="72" stroke="#1e293b" stroke-width="2"/>
  <polygon points="32,72 49,84 41,94 27,87" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Top-Left Point to edge -->
  <line x1="37" y1="43" x2="23" y2="38" stroke="#1e293b" stroke-width="2"/>
  <polygon points="23,38 17,55 7,48 9,33" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Connecting seams between outer patches -->
  <line x1="50" y1="18" x2="77" y2="38" stroke="#1e293b" stroke-width="2"/>
  <line x1="77" y1="38" x2="68" y2="72" stroke="#1e293b" stroke-width="2"/>
  <line x1="68" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="2"/>
  <line x1="32" y1="72" x2="23" y2="38" stroke="#1e293b" stroke-width="2"/>
  <line x1="23" y1="38" x2="50" y2="18" stroke="#1e293b" stroke-width="2"/>

  <!-- Ball highlight shine -->
  <ellipse cx="38" cy="25" rx="15" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-30 38 25)"/>
</svg>